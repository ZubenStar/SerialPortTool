name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v2.1.3, etc.

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    
    strategy:
      matrix:
        platform: [x64]
        configuration: [Release]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Get all history for proper versioning
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'
        dotnet-quality: 'ga'
    
    - name: Extract version from tag
      id: get_version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag -replace '^v', ''
        "version=$version" >> $env:GITHUB_OUTPUT
        "tag=$tag" >> $env:GITHUB_OUTPUT
    
    - name: Verify version.json matches tag
      shell: pwsh
      run: |
        $jsonText = Get-Content version.json -Raw
        $versionJson = $jsonText | ConvertFrom-Json
        $jsonVersion = $versionJson.version.Trim()
        $tagVersion = ("${{ github.ref_name }}" -replace '^v', '').Trim()
        
        if ($jsonVersion -ne $tagVersion) {
          Write-Error "Version mismatch: version.json has $jsonVersion but tag is $tagVersion"
          exit 1
        }
        
        Write-Host "version.json version: '$jsonVersion'"
        Write-Host "git tag version: '$tagVersion'"
        Write-Host "✓ Version verified: $jsonVersion"
    
    - name: Generate BuildInfo
      shell: pwsh
      run: |
        $timestamp = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
        $buildInfoPath = "Helpers/BuildInfo.g.cs"
        
        $content = @"
        // This file is auto-generated during build
        // DO NOT EDIT MANUALLY
        
        using System;
        
        namespace SerialPortTool.Helpers;
        
        internal static class BuildInfo
        {
            public const string BuildTimeUtc = "$timestamp";
        }
        "@
        
        New-Item -ItemType Directory -Force -Path (Split-Path $buildInfoPath -Parent) | Out-Null
        [System.IO.File]::WriteAllText($buildInfoPath, $content, [System.Text.Encoding]::UTF8)
        Write-Host "✓ Generated BuildInfo.g.cs with timestamp: $timestamp"
    
    - name: Restore dependencies
      run: dotnet restore SerialPortTool.csproj -r win-${{ matrix.platform }}
      timeout-minutes: 10
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    
    - name: Build application
      run: |
        dotnet build SerialPortTool.csproj `
          --configuration ${{ matrix.configuration }} `
          --runtime win-${{ matrix.platform }} `
          --self-contained true `
          --no-restore
      timeout-minutes: 15
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    
    - name: Publish application
      run: |
        dotnet publish SerialPortTool.csproj `
          --configuration ${{ matrix.configuration }} `
          --runtime win-${{ matrix.platform }} `
          --self-contained true `
          --output publish/${{ matrix.platform }} `
          -p:PublishTrimmed=false `
          -p:PublishReadyToRun=false `
          -p:PublishSingleFile=false
      timeout-minutes: 15
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    - name: Verify the manifest and the built assembly carry the tag version
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"

        # Package.appxmanifest: the UpdateManifestVersion MSBuild target rewrites the Identity version,
        # and its script used to exit 0 when it could not find the element — a green build that shipped
        # the previous release's version in the manifest.
        $manifest = Get-Content Package.appxmanifest -Raw
        $manifestMatch = [regex]::Match($manifest, '<Identity\s[^>]*\bVersion="([^"]+)"')
        if (-not $manifestMatch.Success) {
          Write-Error "Package.appxmanifest contains no Identity Version attribute"
          exit 1
        }
        $manifestVersion = $manifestMatch.Groups[1].Value
        if ($manifestVersion -ne "$version.0") {
          Write-Error "Package.appxmanifest Identity Version is '$manifestVersion', expected '$version.0'"
          exit 1
        }
        Write-Host "✓ Package.appxmanifest version: $manifestVersion"

        # The assembly: the csproj reads version.json at evaluation time, and a stale hard-coded
        # fallback there meant a mis-versioned build could still succeed. Assert the value actually
        # landed in the binary rather than trusting the evaluation.
        $dll = "publish/${{ matrix.platform }}/SerialPortTool.dll"
        if (-not (Test-Path $dll)) {
          Write-Error "Published assembly not found: $dll"
          exit 1
        }
        $fileVersion = (Get-Item $dll).VersionInfo.FileVersion
        if ($fileVersion -ne "$version.0") {
          Write-Error "SerialPortTool.dll FileVersion is '$fileVersion', expected '$version.0'"
          exit 1
        }
        Write-Host "✓ Published assembly FileVersion: $fileVersion"
    
    - name: Install Inno Setup
      shell: pwsh
      run: |
        choco install innosetup --no-progress -y
        Write-Host "✓ Installed Inno Setup 6"
      timeout-minutes: 10

    - name: Build installer
      shell: pwsh
      run: |
        .\scripts\build-installer.ps1 `
          -Configuration ${{ matrix.configuration }} `
          -SkipPublish
      timeout-minutes: 20

    - name: Create release package
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $platform = "${{ matrix.platform }}"
        $packageName = "SerialPortTool-v$version-win-$platform"
        $packagePath = "packages/$packageName"
        
        # Create package directory
        New-Item -ItemType Directory -Force -Path $packagePath
        
        # Copy published files
        Copy-Item -Path "publish/$platform/*" -Destination "$packagePath/" -Recurse
        
        # Remove *.pdb and the framework language folders we do not ship. The kept-language list and the
        # classification rule live in that script ONLY: this workflow used to keep its own copy of both,
        # which is how the installer payload and the portable ZIP drift apart.
        & .\scripts\prune-publish-output.ps1 -Path $packagePath
        
        # Create ZIP archive
        Compress-Archive -Path "$packagePath/*" -DestinationPath "$packagePath.zip"

        # Compress-Archive happily produces a valid archive from an empty directory; that would ship as
        # the portable release asset with no error anywhere.
        $zipBytes = (Get-Item "$packagePath.zip").Length
        if ($zipBytes -lt 1MB) {
          Write-Error "Portable package looks empty ($zipBytes bytes): $packageName.zip"
          exit 1
        }
        
        Write-Host "✓ Created package: $packageName.zip ($([math]::Round($zipBytes / 1MB, 1)) MB)"
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: SerialPortTool-${{ steps.get_version.outputs.version }}-win-${{ matrix.platform }}
        path: |
          packages/*.zip
          packages/installer/*.exe
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Extract version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
    
    - name: Generate release notes
      id: release_notes
      shell: pwsh
      run: |
        $versionJson = Get-Content version.json | ConvertFrom-Json
        $version = "${{ steps.get_version.outputs.version }}"
        
        # Find the changelog for this version
        $changelog = $versionJson.changelog | Where-Object { $_.version -eq $version } | Select-Object -First 1
        
        if ($null -eq $changelog) {
          Write-Error "No changelog found for version $version in version.json"
          exit 1
        }
        
        # Build release notes
        $notes = @"
        # SerialPortTool $version
        
        **Release Date:** $($changelog.date)
        
        ## What's Changed
        
        $($changelog.changes | ForEach-Object { "- $_" } | Out-String)
        
        ## Downloads
        
        Two packages are provided for 64-bit Windows PCs. Both are self-contained and require no additional dependencies.
        
        ## Installation
        
        **Recommended - installer (enables in-app automatic updates):**
        
        1. Download `SerialPortTool-Setup-v$version-win-x64.exe`
        2. Run it - it installs per-user (no administrator rights required) and creates a Start menu shortcut
        3. Launch SerialPortTool from the Start menu
        
        **Portable ZIP:**
        
        1. Download `SerialPortTool-v$version-win-x64.zip`
        2. Extract to a folder of your choice
        3. Run SerialPortTool.exe
        
        > Automatic updates only apply to the installed build. The portable build only notifies you and opens the download page.
        
        ## System Requirements
        
        - Windows 10 version 1809 (build 17763) or later
        - Windows 11 (recommended)
        
        ---
        
        **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.get_version.outputs.tag }}...HEAD
        "@
        
        # Save to file
        $notes | Out-File -FilePath release-notes.md -Encoding utf8
        
        Write-Host "✓ Generated release notes"
    
    - name: Download all artifacts
      uses: actions/download-artifact@v7
      with:
        path: artifacts
    
    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        find artifacts -name "*.zip" -exec cp {} release-assets/ \;
        find artifacts -name "*.exe" -exec cp {} release-assets/ \;
        ls -lh release-assets/

        # Assert both artifact kinds are actually present. The check below only rejected a completely
        # empty set, so a run where the installer step silently produced nothing (or the upload path
        # glob missed) still published a Release — with a portable ZIP and no Setup.exe, leaving the
        # in-app auto-update with nothing to download.
        if ! ls release-assets/*.exe >/dev/null 2>&1; then
          echo "::error::No Setup.exe among the release assets; the in-app auto-update has nothing to download"
          exit 1
        fi
        if ! ls release-assets/*.zip >/dev/null 2>&1; then
          echo "::error::No portable ZIP among the release assets"
          exit 1
        fi
    
    - name: Create or update GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.get_version.outputs.tag }}
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        shopt -s nullglob
        assets=(release-assets/*.zip release-assets/*.exe)
        
        if [ ${#assets[@]} -eq 0 ]; then
          echo "No release assets found in release-assets/"
          exit 1
        fi
        
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists, updating notes and assets"
          gh release edit "$TAG" \
            --title "SerialPortTool $VERSION" \
            --notes-file release-notes.md \
            --draft=false
          gh release upload "$TAG" "${assets[@]}" --clobber
        else
          echo "Creating release $TAG"
          gh release create "$TAG" "${assets[@]}" \
            --title "SerialPortTool $VERSION" \
            --notes-file release-notes.md
        fi
    
    - name: Upload release artifacts to release
      uses: actions/upload-artifact@v6
      with:
        name: release-notes
        path: release-notes.md
        retention-days: 90
